name: Improve an existing mod or skill
description: A change to how a mod or skill in this repository works.
title: "[improvement] <name>: "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod or skill
      options:
        # mods:start
        - big-output
        - bingo
        - circuit-breaker
        - connect-four
        - copy-last
        - ding
        - fence
        - game-2048
        - guard-setup
        - mcp-diet
        - memory-lint
        - pairs
        - pins
        - pkg-guard
        - red-green
        - right-tool
        - show-paths
        - skill-diet
        - snake
        - standup
        - style-cop
        - sudoku
        - tripwire
        - trust-but-verify
        - typing
        - undo-agent
        - vet-plugin
        - watchtower
        - xo
        # mods:end
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What the mod does today that gets in your way, or what it can't do yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you'd like
      description: What it should do instead. If you know the event or `$` call involved, say so.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: A setting, a permission rule, another mod, or a workaround.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to send the pull request myself.
