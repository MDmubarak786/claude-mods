name: Docs or templates
description: Something in a README, the docs folder, or a template is wrong or missing.
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the file or section.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing
    validations:
      required: true
