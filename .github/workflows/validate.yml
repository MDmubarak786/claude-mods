name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - name: Validate marketplace, mods, tests, and README table
        run: scripts/validate.sh
      - name: Require a version bump on changed mods
        if: github.event_name == 'pull_request'
        run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
